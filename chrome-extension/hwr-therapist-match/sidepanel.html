<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Therapist Match</title>
<style>
  html, body { margin: 0; height: 100%; background: #FBFCF7; }
  /* Shown only until the tool loads (or if there's no internet connection) */
  .loading { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
    font: 500 14px/1.5 system-ui, sans-serif; color: #6B5148; }
  iframe { position: relative; display: block; width: 100%; height: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
  <div class="loading">Loading Therapist Match…<br>If this stays blank, check the internet connection.</div>
  <!-- The tool itself lives on the HWR site, so updates there show up here automatically -->
  <iframe src="https://hwr-timers.netlify.app/therapist-match-panel/" title="Therapist Match" allow="clipboard-write"></iframe>
</body>
</html>
